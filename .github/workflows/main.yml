name: Build apps

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm --clean --windowed --onefile --name ExcelPrintFormatter app.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ExcelPrintFormatter-${{ matrix.os }}
          path: dist/*
